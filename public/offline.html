<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#2878f0">
    <title>오프라인 — FinScope</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#191f2c;font-family:"Noto Sans KR",system-ui,sans-serif}.card{width:min(560px,100%);padding:48px;border:1px solid #dce5f1;border-radius:28px;background:#fff;box-shadow:0 18px 55px rgba(39,72,120,.08)}.mark{display:grid;width:48px;height:48px;place-items:center;border-radius:14px;background:#2878f0;color:#fff;font-size:25px;font-weight:800}h1{margin:28px 0 12px;font-size:32px;letter-spacing:-.04em}p{margin:0;color:#53627a;line-height:1.8}a{display:inline-block;margin-top:28px;padding:13px 20px;border-radius:12px;background:#2878f0;color:#fff;font:inherit;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">F</div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>FinScope 화면은 열 수 있지만 최신 금융 데이터는 서버 연결이 필요합니다.</p>
      <a href="/">다시 연결하기</a>
    </main>
  </body>
</html>
